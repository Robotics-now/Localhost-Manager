name: Update README Version

on:
  release:
    types: [published]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Badge in README
        shell: python
        run: |
          import os, re

          raw_tag = "${{ github.event.release.tag_name }}"
          clean_version = raw_tag.lstrip('Vv')
          print(f"Original Tag: {raw_tag} -> Clean Version: {clean_version}")

          # Build the entire row of badges on a single line
          version_badge = f"[![Version](https://img.shields.io/badge/Version-{clean_version}-4fc3f7?style=flat-square)](https://github.com/Robotics-now/Localhost-Manager/releases)"
          manifest_badge = "[![Manifest](https://img.shields.io/badge/Manifest-V3-22c55e?style=flat-square)](https://developer.chrome.com/docs/extensions/develop/migrate/what-is-mv3)"
          license_badge = "[![License](https://img.shields.io/badge/License-GPL3.0-f59e0b?style=flat-square)](https://github.com/Robotics-now/Localhost-Manager?tab=GPL-3.0-1-ov-file)"
          node_badge = "[![Node](https://img.shields.io/badge/Requires-Node.js-3c873a?style=flat-square)](https://nodejs.org/en)"
          
          # Combine them with a space in between
          all_badges = f"{version_badge} {manifest_badge} {license_badge} {node_badge}"

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          # Replace everything between the tags on that single line safely
          pattern = r"(<!-- VERSION_START -->).*?(<!-- VERSION_END -->)"
          updated_content = re.sub(pattern, f"\\1{all_badges}\\2", content)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated_content)

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: bump README version badge to ${{ github.event.release.tag_name }}" || echo "No changes to commit"
          git push
